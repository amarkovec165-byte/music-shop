<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore — Музыкальные инструменты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
        }

        /* Шапка */
        header {
            background: #1a1a2e;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #e94560;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Герой-секция */
        .hero {
            background: linear-gradient(135deg, #16213e, #0f3460);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Каталог */
        .catalog {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .catalog h3 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            color: #1a1a2e;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            height: 200px;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-info h4 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #1a1a2e;
        }

        .product-category {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .product-price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #e94560;
            margin-top: auto;
        }

        .btn-add {
            margin-top: 1rem;
            background: #0f3460;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .btn-add:hover {
            background: #e94560;
        }

        /* Подвал */
        footer {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f3460;
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎸 MusicStore</h1>
        <div class="cart-icon" onclick="alert('В корзине: ' + cart.length + ' товаров')">
            🛒 <span class="cart-count" id="cart-count">0</span>
        </div>
    </header>

    <section class="hero">
        <h2>Добро пожаловать в MusicStore</h2>
        <p>Лучшие инструменты для настоящих музыкантов</p>
    </section>

    <section class="catalog">
        <h3>Наш каталог</h3>
        <div class="products" id="products-container">
            <!-- Товары добавляются через JS -->
        </div>
    </section>

    <footer>
        <p>&copy; 2025 MusicStore. Все права защищены.</p>
    </footer>

    <div class="toast" id="toast">Товар добавлен в корзину!</div>

    <script>
        // Данные о товарах
        const products = [
            { id: 1, name: "Электрогитара Fender Stratocaster", category: "Гитары", price: 89990, icon: "🎸" },
            { id: 2, name: "Акустическая гитара Yamaha F310", category: "Гитары", price: 15990, icon: "🎸" },
            { id: 3, name: "Синтезатор Roland FP-10", category: "Клавишные", price: 54990, icon: "🎹" },
            { id: 4, name: "Цифровое пианино Casio CDP-S110", category: "Клавишные", price: 42990, icon: "🎹" },
            { id: 5, name: "Барабанная установка Pearl Roadshow", category: "Ударные", price: 65990, icon: "🥁" },
            { id: 6, name: "Электронная ударная установка Alesis Nitro", category: "Ударные", price: 38990, icon: "🥁" },
            { id: 7, name: "Скрипка Stagg VN-4/4", category: "Струнные", price: 12990, icon: "🎻" },
            { id: 8, name: "Саксофон Yamaha YAS-280", category: "Духовые", price: 89990, icon: "🎷" }
        ];

        // Корзина
        let cart = [];

        // Отрисовка товаров
        const container = document.getElementById('products-container');

        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-image">${product.icon}</div>
                <div class="product-info">
                    <h4>${product.name}</h4>
                    <p class="product-category">${product.category}</p>
                    <p class="product-price">${product.price.toLocaleString('ru-RU')} ₽</p>
                    <button class="btn-add" onclick="addToCart(${product.id})">Добавить в корзину</button>
                </div>
            `;
            container.appendChild(card);
        });

        // Добавление в корзину
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                document.getElementById('cart-count').textContent = cart.length;
                showToast(`${product.name} добавлен в корзину`);
            }
        }

        // Показ уведомления
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
